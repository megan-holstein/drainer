name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite is hermetic: it builds a throwaway bare repo as its own origin,
    # registers it under a sandbox DRAINER_CONFIG with no `githubRepo`, and
    # points DRAINER_STATE at a temporary directory. So it needs no network, no
    # `gh` CLI and no credentials, and every section runs here — the PR checks
    # take the documented skip path rather than being switched off for CI.
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The drainer merges and commits on the runner's behalf. The suite sets an
      # identity in the sandbox repo it builds, but a global one costs nothing
      # and keeps any step that reaches outside it from dying on "please tell me
      # who you are".
      - name: Give git an identity
        run: |
          git config --global user.name  "drainer ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Syntax check
        run: node --check drainer.mjs

      - name: The example config loads
        run: |
          DRAINER_CONFIG="$PWD/repos.example.json" \
          DRAINER_STATE="$(mktemp -d)" \
          node drainer.mjs status

      - name: End-to-end suite
        run: bash test-drainer.sh
